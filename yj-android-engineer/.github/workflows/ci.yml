name: YJ Webcam CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew test --stacktrace

  windows-build:
    name: Build Windows Desktop App & Virtual Camera
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: nuget restore windows/YJWebcam.sln

      - name: Build Solution (Release)
        run: msbuild windows/YJWebcam.sln /p:Configuration=Release /p:Platform="x64"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: YJWebcam-Windows-x64
          path: |
            windows/YJWebcam.Desktop/bin/x64/Release/net8.0-windows10.0.19041.0/
            windows/YJWebcam.VirtualCamera/x64/Release/YJWebcamVirtualCam.dll
